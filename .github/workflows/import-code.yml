name: Import source code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-code.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download archive from Google Drive
        run: |
          set -euo pipefail
          curl -sSL "https://drive.google.com/uc?export=download&id=11gZ3eil5lLSIFppyTDRAj1H-6cGwdIfi" -o /tmp/code.zip
          ls -l /tmp/code.zip
          file /tmp/code.zip
          if ! unzip -tq /tmp/code.zip >/dev/null 2>&1; then
            echo "Not a valid zip, aborting"; exit 1
          fi

      - name: Extract
        run: |
          set -euo pipefail
          mkdir -p /tmp/x
          unzip -oq /tmp/code.zip -d /tmp/x
          SRC="$(find /tmp/x -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          echo "Source dir: $SRC"
          cp -a "$SRC"/. .
          echo "--- top level after copy ---"
          ls -la

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "solabiwonderful11-png"
          git config user.email "solabiwonderful11-png@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Import Sholab Dex Tech source code"
            git push origin HEAD:main
          fi
